<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedNote</title>
    <link rel="stylesheet" href="styles.css?v=templates-ui2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Основная навигация">
        <a class="brand" href="#/" aria-label="MedNote, главная">
          <span class="brand-mark">M</span>
          <span>
            <strong>MedNote</strong>
            <small>память врача</small>
          </span>
        </a>
        <nav class="nav-list" aria-label="Разделы">
          <a class="nav-item active" href="#/" data-nav-section="home" aria-current="page">
            <span aria-hidden="true">●</span>
            Главная
          </a>
          <a class="nav-item" href="#/patients" data-nav-section="patients">
            <span aria-hidden="true">●</span>
            Пациенты
          </a>
          <a class="nav-item" href="#/templates" data-nav-section="templates">
            <span aria-hidden="true">●</span>
            Шаблоны
          </a>
        </nav>
        <div class="storage-note">
          <button class="text-button sidebar-auth-action" id="logoutButton" type="button" hidden>Выйти</button>
        </div>
      </aside>

      <main id="app" class="main" tabindex="-1">
        <section class="state-panel">
          <div class="spinner" aria-hidden="true"></div>
          <p>Загрузка картотеки из MedNote Cloud...</p>
        </section>
      </main>
    </div>

    <template id="attachmentPreviewTemplate">
      <div class="attachment-row">
        <div class="attachment-thumb" aria-hidden="true"></div>
        <div class="attachment-meta">
          <strong></strong>
          <span></span>
        </div>
        <button class="icon-button danger" type="button" aria-label="Удалить вложение">×</button>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script src="document-parser.js?v=document-parser-fix1"></script>
    <script src="document-import.js?v=document-import-polish2"></script>
    <script src="app.js?v=templates-ui2"></script>
  </body>
</html>
